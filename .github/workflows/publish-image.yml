# Checked custom pushes publish a native ARM64 image to the repository owner's
# GHCR namespace. Tags and manual releases retain multi-architecture builds.
# New GHCR packages default to private. Deployment uses the published digest.
name: Publish image

on:
  workflow_call:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      latest:
        description: 'Also move the "latest" tag to this build'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.ref != 'refs/heads/custom' || github.event_name == 'push'
    runs-on: ${{ github.ref == 'refs/heads/custom' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image and release
        shell: bash
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "RELEASE=${GITHUB_SHA:0:8}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
        if: github.ref != 'refs/heads/custom'
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha
            type=edge
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || inputs.latest == true }}
          labels: |
            org.opencontainers.image.title=Folio
            org.opencontainers.image.description=Git-native collaborative wiki
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}

      - id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.ref == 'refs/heads/custom' && 'linux/arm64' || 'linux/amd64,linux/arm64' }}
          build-args: FOLIO_RELEASE=${{ env.RELEASE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Record deployable image
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
